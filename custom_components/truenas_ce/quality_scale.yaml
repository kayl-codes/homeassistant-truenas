rules:
  # Bronze
  action-setup:
    status: done
    comment: |
      Domain-level alert/passphrase services are registered in async_setup;
      the handlers resolve the target config entry at call time and reject
      missing/unloaded entries with ServiceValidationError.
  appropriate-polling: done
  brands:
    status: done
    comment: |
      Brand images ship inside the integration (brand/ folder with icon,
      dark_icon and @2x variants), served locally by HA 2026.3+. The brands
      repository no longer accepts custom-integration submissions, so this is
      the supported path. A core migration would still need a brands-repo PR.
  common-modules: done
  config-flow: done
  config-flow-test-coverage:
    status: done
    comment: |
      tests/test_config_flow.py covers the pure helpers and validation logic;
      tests/test_config_flow_flows.py drives the user/migrate/reauth/
      reconfigure/options steps end to end via pytest-homeassistant-custom-
      component, installed CI-only (Linux) since it cannot run on the Windows
      dev machine (its plugin imports fcntl) -- conftest.py skips collecting
      that module locally when the package is absent.
  dependency-transparency: done
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions:
    status: done
    comment: README has a dedicated "Removing the integration" section.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data:
    status: done
    comment: |
      The coordinator lives in config_entry.runtime_data, typed via the
      TrueNASConfigEntry alias in coordinator.py.
  test-before-configure: done
  test-before-setup: done
  unique-config-entry:
    status: done
    comment: |
      The user flow aborts (already_configured) when another entry already
      uses the same host, in addition to the duplicate-name check.

  # Silver
  action-exceptions:
    status: done
    comment: |
      Unsupported entity actions raise ServiceValidationError
      (_raise_unsupported). Every entity action that calls
      coordinator.api.query() now also raises HomeAssistantError when that
      call actually failed, via the shared TrueNASEntity._raise_if_api_error
      helper (and coordinator.async_run_task for the shared run-task path) --
      checking api.error rather than a None return value, since many
      middleware endpoints legitimately return null on success too.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: Handled by DataUpdateCoordinator (logs once on failure/recovery).
  parallel-updates: done
  reauthentication-flow: done
  test-coverage:
    status: done
    comment: |
      CI (pytest --cov, which includes the hass-fixture-based flow/service
      tests skipped on this repo's Windows dev machine) reports 99 % overall
      coverage, well above the Silver requirement. The remaining handful of
      lines are a couple of unreachable defensive branches in coordinator.py
      (parse_api/​_unwrap_app_stats_message already guarantee the shapes they
      guard against) and two multi-config-entry edge branches in
      entity.async_add_entities, none of which are reachable from pure unit
      tests without a running Home Assistant core.

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: todo
    comment: |
      TrueNAS advertises via mDNS; evaluate zeroconf discovery for the config
      flow.
  discovery-update-info:
    status: todo
    comment: Follows the discovery rule.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations:
    status: todo
    comment: |
      Scattered hints exist (reverse-proxy/Cloudflare section); consolidate a
      dedicated known-limitations section in the README.
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: done
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations:
    status: todo
    comment: |
      Only the diagnostic buttons use translation_key; the remaining entities
      carry hard-coded English names in their descriptions.
  exception-translations:
    status: todo
    comment: |
      ServiceValidationError/HomeAssistantError are raised with literal
      English messages instead of translation_domain/translation_key.
  icon-translations:
    status: todo
    comment: Icons are set via the entity descriptions; no icons.json yet.
  reconfiguration-flow: done
  repair-issues: done
  stale-devices:
    status: done
    comment: |
      Orphaned entities and empty devices are removed on every setup
      (_cleanup_orphaned_entities); recorder statistics get a repair issue.

  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: |
      aiotruenas speaks JSON-RPC over its own `websockets` connection; there
      is no aiohttp/httpx session to inject.
  strict-typing:
    status: done
    comment: |
      aiotruenas is PEP 561 compliant (ships py.typed) and the integration
      passes mypy --strict (configured in pyproject.toml).
