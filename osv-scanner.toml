# OSV-Scanner configuration, picked up automatically next to Pipfile.lock.

# Pillow is only a transitive dev/test dependency pulled in by homeassistant
# (never shipped with the integration). Home Assistant up to 2026.10.4 (latest
# checked on 2026-10-27) pins `Pillow==12.3.0` exactly, so re-locking can't
# move it. While the lock stays at 12.3.0, every advisory against that version
# is ignored, including ones published later; the override is limited to that
# version and the `dev` group, so a newer Pillow or a runtime Pillow is still
# reported. `effectiveUntil` forces a re-check: when it expires, look whether
# Home Assistant has bumped its pin, re-lock, and drop or extend this block.
[[PackageOverrides]]
name = "pillow"
version = "12.3.0"
ecosystem = "PyPI"
group = "dev"
effectiveUntil = 2027-01-31
vulnerability.ignore = true
reason = "Dev-only transitive dependency; homeassistant pins Pillow==12.3.0 exactly."
