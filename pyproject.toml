[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "ASYNC"]
ignore = []

[tool.mypy]
python_version = "3.14"
files = ["custom_components/truenas_ce"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
# Home Assistant 2026.10+ aliases `voluptuous` to probatio at startup
# (probatio.compat.install_as_voluptuous) and types its APIs with probatio
# classes, while mypy still resolves `import voluptuous` to the real package.
# Treat voluptuous as untyped so the same code checks against old and new HA.
module = ["voluptuous", "voluptuous.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
# HA 2026.10 moved BinarySensorDeviceClass to binary_sensor/const.py and only
# re-exports it implicitly; importing it from the package still works at runtime
# on every supported HA release, whereas the const module is missing pre-2026.10.
module = ["homeassistant.components.binary_sensor"]
implicit_reexport = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # aiohttp deprecation triggered inside Home Assistant core's http component
    # (HomeAssistantApplication subclasses web.Application) — not our code;
    # HA core filters the same warning in its own test config.
    "ignore:Inheritance class HomeAssistantApplication from web.Application is discouraged:DeprecationWarning",
]
