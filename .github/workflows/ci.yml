name: CI

on:
  push:
    paths:
      - 'custom_components/**'
      - 'tests/**'
      - '.github/**'
      - '**.md'
      - 'docs/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'custom_components/**'
      - 'tests/**'
      - '.github/**'
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:

  ruff:
    name: Ruff Linter & Formatter
    runs-on: ubuntu-latest
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Ruff
        run: pip install --only-binary ":all:" ruff==0.15.21
      - name: Run Ruff Check
        run: ruff check .
      - name: Run Ruff Format
        run: ruff format --check .

  tests:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python 3.14
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'
      - name: Install locked dependencies
        uses: ./.github/actions/install-core-deps
      - name: Install homeassistant + pytest-homeassistant-custom-component (CI-only, Linux)
        # --only-binary omitted: homeassistant (see _SEPARATE_DEV_PACKAGES in
        # generate_requirements.py) pins its own transitive deps (aiohttp,
        # fnv-hash-fast, lru-dict, ...) to versions that don't ship wheels for every
        # release, and pytest-homeassistant-custom-component's mock-open==1.4.0
        # dependency has never published a wheel, only an sdist, on any release.
        run: |
          pip install -r requirements_tests_unpinned.txt pytest-homeassistant-custom-component==0.13.348
      - name: Test with pytest
        run: pytest --cov=custom_components/truenas_ce --cov-report=term-missing

  mypy:
    name: Mypy strict typing
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python 3.14
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'
      - name: Install locked dependencies
        uses: ./.github/actions/install-core-deps
      - name: Install homeassistant (CI-only, Linux)
        # --only-binary omitted: homeassistant (see _SEPARATE_DEV_PACKAGES in
        # generate_requirements.py) pins its own transitive deps (aiohttp,
        # fnv-hash-fast, lru-dict, ...) to versions that don't ship wheels for every
        # release.
        run: |
          pip install -r requirements_tests_unpinned.txt
      - name: Run mypy (strict, per pyproject.toml)
        run: mypy

  security:
    name: Security check - Bandit
    needs: [tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'
      - name: Install Bandit
        run: pip install --only-binary ":all:" bandit==1.9.4
      - name: Security check - Bandit
        run: bandit -r custom_components/truenas_ce

  translations:
    name: Validate translations
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python 3.14
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'
      - name: Validate translation parity against en.json
        run: python3 .github/validate_translations.py

  validate:
    name: Check hassfest
    needs: [tests]
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master
